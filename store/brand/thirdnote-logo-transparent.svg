<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26355F"/><stop offset="1" stop-color="#121931"/></linearGradient>
  </defs>
  
  <!-- Drawn on a 1000x540 grid, centred in the square -->
  <g transform="translate(100 296) scale(0.82)">
    <!-- note page on the right, its top edge is the long bar -->
    <rect x="600" y="60" width="340" height="420" rx="0" fill="#F2C94C"/>
    <path d="M690 180 H880 M690 250 H880 M690 320 H880 M690 390 H820" stroke="#141B33" stroke-width="30" stroke-linecap="round"/>
    <!-- long top bar: T crossbar running into the page's top edge -->
    <rect x="40" y="0" width="900" height="96" rx="10" fill="#FFFFFF"/>
    <!-- T stem: a pencil pointing down -->
    <rect x="160" y="96" width="120" height="250" fill="#FFFFFF"/>
    <path d="M200 120 V330 M240 120 V330" stroke="#141B33" stroke-width="12" stroke-linecap="round" opacity=".15"/>
    <path d="M160 346 H280 L220 480 Z" fill="#F2C94C"/>
    <path d="M196 426 H244 L220 480 Z" fill="#141B33"/>
    <!-- N: left leg, diagonal, right leg (= the page's left edge) -->
    <path d="M330 150 H430 L520 340 V96 H620 V480 H520 L430 290 V480 H330 Z" fill="#FFFFFF"/>
  </g>
</svg>