<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThirdNote</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon32.png" alt="" width="22" height="22"><span>ThirdNote</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="theme" data-i18n-title="sp.theme"></button>
      <a class="icon-btn" href="../options/options.html" target="_blank" id="settings" data-i18n-title="common.settings"></a>
    </div>
  </header>

  <section class="collect" id="collect"></section>

  <div class="controls">
    <label class="search" id="search-wrap"><input id="q" type="search" data-i18n-placeholder="sp.search"></label>
    <div class="seg tabs" id="tabs"></div>
    <div class="chips" id="colors" hidden></div>
  </div>

  <main id="main"></main>
  <div class="toast" id="toast" hidden></div>

  <script src="../lib/shared.js"></script>
  <script src="../lib/i18n.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
